<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calember: a harmonized MODIS + VIIRS fire record from 2000 to now. Pick any area and see its fire calendar." />
    <meta name="color-scheme" content="dark" />
    <title>Calember · classic view</title>
    <style>
      /* the interface at 90 % on desktop screens; the 3D canvas and the maps stay at full scale (src/uiZoom.ts) */
      :root { --unzoom: 1; }
      @media (min-width: 1100px) and (min-height: 600px) and (pointer: fine) {
        html { zoom: 0.9; }
        :root { --unzoom: 1.1111111; }
      }
      .world, .pmap, .map { zoom: var(--unzoom); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
